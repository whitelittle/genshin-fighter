<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>教学关 · 荧行走</title>
<style>body{margin:24px auto;padding:0 20px;max-width:1200px;background:#202e49;color:#f5f4ed;font:17px system-ui}button,select{font:inherit;padding:8px;margin:5px}canvas{background:#263454;width:100%;height:auto;image-rendering:pixelated;border:1px solid #58647b}p{line-height:1.7}.controls{display:flex;flex-wrap:wrap;align-items:center}</style>
<h1>教学关 · 荧行走</h1><p>沿用已定母版、拟合方式与配色效果。本批为新行走动作候选，左右腿交替；四张真实关键姿，不把重复保持算成补帧。后退与冲刺另行处理。</p>
<div class="controls"><button id="play">暂停</button><button id="prev">上一姿</button><button id="next">下一姿</button><select id="mode"><option value="fit">像素拟合</option><option value="source">高清源图</option></select><select id="speed"><option value="1">正常速度</option><option value="0.5">半速</option><option value="0.25">四分之一速</option></select><label><input type="checkbox" id="mirror">镜像</label><label><input type="checkbox" id="idle">待机→行走→待机</label><label><input type="checkbox" id="light">浅背景</label></div>
<canvas id="view" width="1200" height="540"></canvas><p id="info"></p><input id="scrub" type="range" min="0" max="45" value="0" style="width:100%"><p>左：已定母版；右：当前行走姿。两侧共用人体单位与脚底基准，未按动作外框缩放。可慢放、逐姿、镜像及比较高清源图。</p><script src="walk-data.js"></script>
<script>
(async()=>{const W=window.WALK,canvas=document.querySelector('#view'),ctx=canvas.getContext('2d'),get=id=>document.getElementById(id),imgs={};await Promise.all(Object.entries(W.frames).flatMap(([key,v])=>['fit','source'].map(async mode=>{const im=new Image();im.src=mode==='fit'?v.file:v.source;await im.decode();imgs[key+'-'+mode]=im;})));let t=0,playing=true,last=performance.now();const total=W.durations.reduce((a,b)=>a+b,0);function pick(n){let q=n%total;for(let i=0;i<W.keys.length;i++){if(q<W.durations[i])return i;q-=W.durations[i];}return 0;}function draw(key,x){const f=W.frames[key],mode=get('mode').value,im=imgs[key+'-'+mode];const scale=mode==='fit'?f.scale:W.sourceUnit,anchor=mode==='fit'?f.anchor:f.sourceAnchor;ctx.save();ctx.translate(x,465);if(get('mirror').checked)ctx.scale(-1,1);ctx.imageSmoothingEnabled=mode==='source';ctx.drawImage(im,-anchor[0]*scale,-anchor[1]*scale,im.width*scale,im.height*scale);ctx.restore();}function render(now){const dt=Math.min(100,now-last);last=now;if(playing)t+=dt*.06*Number(get('speed').value);ctx.fillStyle=get('light').checked?'#f0ece5':'#263454';ctx.fillRect(0,0,1200,540);ctx.strokeStyle='#8290a1';ctx.beginPath();ctx.moveTo(20,465.5);ctx.lineTo(1180,465.5);ctx.stroke();let key=W.keys[pick(t)],phase=W.phases[pick(t)];if(get('idle').checked){const q=t%(total+50);if(q<25||q>=25+total){key='master';phase='待机';}else{key=W.keys[pick(q-25)];phase=W.phases[pick(q-25)];}}draw('master',300);draw(key,850);get('info').textContent=phase+' · '+key+' · '+W.frames[key].rectangles+' 身体图元';get('scrub').value=Math.floor(t%total);requestAnimationFrame(render);}get('play').onclick=()=>{playing=!playing;get('play').textContent=playing?'暂停':'播放';};function step(n){playing=false;get('play').textContent='播放';const i=(pick(t)+n+W.keys.length)%W.keys.length;t=W.durations.slice(0,i).reduce((a,b)=>a+b,0);}get('prev').onclick=()=>step(-1);get('next').onclick=()=>step(1);get('scrub').oninput=e=>{playing=false;t=Number(e.target.value);get('play').textContent='播放';};requestAnimationFrame(render);})().catch(e=>document.getElementById('info').textContent='载入失败：'+e.message);
</script></html>
