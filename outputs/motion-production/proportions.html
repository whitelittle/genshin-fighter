<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>正常比例画风对照</title><link rel="stylesheet" href="style.css"><body><header><div><small>PROPORTION STUDY</small><h1>正常比例画风对照</h1></div><a href="index.html">返回五角色动作探针</a></header><main style="display:block;max-width:1200px;margin:auto"><section><p>相同脚底与显示身高：纳西妲仍是儿童身高，调整头身比例，不改为成人。左侧成人角色用于比较画风。此页是待机比例候选，尚未扩展到整套动作。</p><canvas id="comparison" width="1100" height="500"></canvas><p id="status">加载比例候选…</p><label>显示倍率<select id="zoom"><option value="1">游戏尺度</option><option value="1.5">放大查看</option></select></label><p>原版与正常比例版独立保留，未覆盖已有素材。武器参考查询需求已按最新指令撤回。</p><a href="normal-proportion.json">查看拟合数据</a></section></main><script src="data.js"></script><script src="normal-data.js"></script><script>
const c=document.getElementById('comparison'),ctx=c.getContext('2d'),D=window.MOTION_PRODUCTION,N=window.NORMAL_PROPORTION;const entries=[...D.roles.filter(r=>['keqing','diluc','nahida'].includes(r.key)).map(r=>({name:r.name+(r.key==='nahida'?' · 原版':''),frame:r.frames.find(f=>f.id==='basic0')})),{name:'纳西妲 · 正常比例',frame:N}],imgs=[];
function draw(){const z=+document.getElementById('zoom').value;ctx.fillStyle='#172031';ctx.fillRect(0,0,1100,500);ctx.strokeStyle='#687584';ctx.beginPath();ctx.moveTo(0,430);ctx.lineTo(1100,430);ctx.stroke();entries.forEach((e,i)=>{const f=e.frame,img=imgs[i],x=135+i*275,s=f.displayScale*z;ctx.imageSmoothingEnabled=false;ctx.drawImage(img,x-f.pixelAnchor[0]*s,430-f.pixelAnchor[1]*s,img.width*s,img.height*s);ctx.font='18px sans-serif';ctx.fillStyle='#e0cda7';ctx.fillText(e.name,x-90,465);});}Promise.all(entries.map(e=>new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=e.frame.png}))).then(r=>{imgs.push(...r);draw();document.getElementById('status').textContent='相同儿童身高150世界单位；头身调整候选，不代表整套动画已替换。';}).catch(()=>document.getElementById('status').textContent='图片加载失败');document.getElementById('zoom').onchange=draw;
</script></body></html>
