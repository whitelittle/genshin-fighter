<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>玩家反馈 · 评论观察</title>
<style>
:root{color-scheme:light;--ink:#253329;--muted:#68736b;--paper:#f4f5ee;--green:#345947;--line:#dce1d5}*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI','Microsoft YaHei',sans-serif;background:var(--paper);color:var(--ink)}main{max-width:1180px;margin:auto;padding:42px 28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}small,.muted{color:var(--muted)}h1{font-size:34px;font-weight:650;letter-spacing:-1px;margin:8px 0 10px}h2{font-size:17px;margin:0 0 12px}button,select,input{font:inherit;border:1px solid var(--line);border-radius:10px;padding:11px 14px;background:white;color:var(--ink)}button{cursor:pointer}button.primary{background:var(--green);color:white;border:0}button:disabled{opacity:.55}.sources{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:30px 0}.source{background:white;border:1px solid var(--line);border-radius:16px;padding:20px}.source p{font-size:13px;line-height:1.7;margin:6px 0}.badge{display:inline-block;font-size:12px;padding:4px 8px;border-radius:5px;background:#edf1e8;margin:0 4px 6px 0}.error{background:#fae7df;color:#8f452d}.ok{background:#e4f0e3;color:#305b32}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0 16px}input{flex:1;min-width:200px}.list{display:grid;gap:12px}.comment{background:white;border:1px solid var(--line);border-radius:14px;padding:20px}.comment p{font-size:15px;line-height:1.85;white-space:pre-wrap;margin:8px 0 12px;overflow-wrap:anywhere}.meta{font-size:12px;color:var(--muted);line-height:1.8}.note{font-size:13px;line-height:1.8;background:#e9eddf;border-radius:10px;padding:13px 17px}.toolbar{display:flex;gap:8px}.empty{text-align:center;padding:40px}.topics{margin:0 0 14px;display:flex;flex-wrap:wrap;gap:6px}.topics button{font-size:12px;padding:6px 9px}.topics .active{background:var(--green);color:white}a{color:var(--green)}#toast{font-size:13px;margin:12px 0;color:var(--green)}@media(max-width:700px){main{padding:24px 16px}header{display:block}.toolbar{margin-top:20px}.sources{grid-template-columns:1fr}h1{font-size:29px}}
</style></head><body><main>
<header><div><small>原神格斗 / 玩家反馈</small><h1>评论观察</h1><div class="muted">两个来源，一份匿名反馈记录。</div></div><div class="toolbar"><button id="reload">刷新页面</button><button class="primary" id="request">请求采集</button></div></header>
<div class="sources" id="sources"></div>
<div class="note">每小时采集一次，需要电脑与Codex运行、原站登录有效；页面每30秒读取本地结果。相同文本合并，主题为关键词初筛；条目数不代表玩家人数。采集失败保留旧数据，不自动删除评论。请求采集会交给下一次小时任务处理。</div>
<div id="toast" role="status"></div>
<div class="filters"><input id="search" placeholder="搜索反馈，例如：大招、卡顿、克洛琳德" aria-label="搜索反馈"><select id="source" aria-label="来源"><option value="">全部来源</option><option value="bilibili">B站</option><option value="miyoushe">米游社</option></select><select id="kind" aria-label="记录类型"><option value="">全部记录</option><option value="live" selected>采集正文</option><option value="summary">历史整理摘要</option></select></div>
<div id="topics" class="topics"></div><p class="muted" id="count"></p><div id="list" class="list"></div>
<footer class="meta" style="margin-top:30px">仅本机显示 · 原站评论可能增删或受登录限制 · 反馈不等于复现结论或批准的新设计</footer>
</main><script src="/app.js"></script></body></html>
