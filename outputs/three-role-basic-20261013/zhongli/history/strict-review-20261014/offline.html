// Presentation only: 60Hz tick timeline does not implement game combat.
const $=id=>document.getElementById(id),ctx=$('cv').getContext('2d');
let neutralFrames=[],neutralImages=[],frames=[],images=[],time=0,playing=true,last=0,bank={},selected='待机',loadVersion=0;
let durations=[],phases=[],total=1,effectImages=[],foeAtlas=null,foeImages={},foeFitted={},foeFitImages={},ultimatePortrait,ultimatePortraitFit;
const imageCache=new Map();
function loadImage(file){if(!imageCache.has(file))imageCache.set(file,new Promise((ok,no)=>{const im=new Image();im.onload=async()=>{try{if(im.decode)await im.decode();ok(im)}catch(e){no(e)}};im.onerror=()=>no(Error('素材加载失败：'+file));im.src=file}));return imageCache.get(file)}
const groups={'移动与防御':['待机','前走','后退','跳跃','前冲','后撤','蹲下','站立格挡','蹲防'],'攻击':['轻攻一','轻攻二','轻攻三','站重','蹲轻','蹲重','空轻','空重'],'技能与投技':['E · 地心','Q · 天星','投技','被投'],'受击与结算':['受击与倒地','起身','胜利','败北']};
function phase(){let t=time;for(let i=0;i<durations.length;i++){if(t<durations[i])return i;t-=durations[i]}return Math.max(0,durations.length-1)}
function phaseProgress(){const p=phase(),start=durations.slice(0,p).reduce((a,b)=>a+b,0);return [p,Math.min(1,Math.max(0,(time-start)/durations[p]))]}
const lerp=(a,b,u)=>a+(b-a)*u;
function pairedRoot(){const [p,u]=phaseProgress();if(p===0)return [lerp(580,535,u),550];if(p===1)return [535,550];if(p===2)return [535,550];if(p===3)return [lerp(535,680,u),550-65*Math.sin(u*Math.PI/2)];if(p===4)return [lerp(680,755,u),lerp(485,550,u)];return [755,550]}
function victimRoot(){const [p,u]=phaseProgress();if(p===0)return [lerp(410,450,u),550];if(p===1)return [450,385];if(p===2)return [450,385];if(p===3)return [lerp(450,300,u),385-60*Math.sin(u*Math.PI/2)];if(p===4)return [lerp(300,220,u),lerp(440,550,u)];return [220,550]}
function stageRoot(){let x=410,y=550;const [p,u]=phaseProgress(),t=time/Math.max(1,total),d=bank[selected];if(selected==='被投')return victimRoot();if(selected==='投技')return [410+(p===1?10*u:p===2?10:p===3?10*(1-u):0),550];
 if(selected==='空轻'||selected==='空重'){const base={rise:.30,apex:.50,fall:.70}[$('airphase').value],jt=Math.min(.93,base+time/160);return [410,385-160*Math.sin(jt*Math.PI)]}
 if(selected==='跳跃'&&p>0&&p<5)return [410,385-160*Math.sin(t*Math.PI)];
 if(selected==='受击与倒地'&&p===2)return [x,385-80*Math.sin(u*Math.PI/2)];if(selected==='受击与倒地'&&p===3)return [x,305+150*u];if((selected==='前冲'||selected==='后撤')&&(p===2||p===3))y=385-25*Math.sin((p-2+u)*Math.PI/2);if(!$('stageMove').checked)return [x,y];
 if(selected==='前走')x+=100*t;if(selected==='后退')x-=90*t;
 if(selected==='前冲')x+=155*Math.min(1,t/.8);if(selected==='后撤'){x-=135*Math.min(1,t/.8);}
 if(d?.combatDesign?.lunge)x+=d.combatDesign.lunge*Math.min(1,time/d.combatDesign.startup);
 return [x,y]}
function shadow(){/* No decorative floor shadow. */}
function drawPose(c,i,x,y,scale){const f=frames[i],im=images[i];if(!im)return;c.imageSmoothingEnabled=false;c.drawImage(im,x-f.anchor[0]*scale,y-f.anchor[1]*scale,im.naturalWidth*scale,im.naturalHeight*scale)}
function isNeutralTail(){return selected==='E · 地心'&&time>=bank[selected].bodyActionTicks}
function drawCurrentBody(x,y){
 if(!isNeutralTail()){const i=phase();drawPose(ctx,i,x,y,frames[i].scale);return}
 const idle=bank['待机'],elapsed=(time-bank[selected].bodyActionTicks)%idle.durations.reduce((a,b)=>a+b,0);
 let remain=elapsed,index=0;while(index<idle.durations.length-1&&remain>=idle.durations[index])remain-=idle.durations[index++];
 const f=neutralFrames[index],im=neutralImages[index];if(!f||!im)return;
 ctx.imageSmoothingEnabled=false;ctx.drawImage(im,x-f.anchor[0]*f.scale,y-f.anchor[1]*f.scale,im.naturalWidth*f.scale,im.naturalHeight*f.scale);
}

async function loadFoe(){const fits=JSON.parse(document.getElementById('foeData').textContent),loaded={};await Promise.all(Object.entries(fits).map(async([key,f])=>loaded[key]=await loadImage(f.file)));foeAtlas={};foeFitted=fits;foeFitImages=loaded}
function drawFoe(){if(!$('opponent').checked||!foeAtlas)return;let key='basic',index=0,x=810,y=550,flip=-1;const p=phase();
 if(selected==='投技'){[x,y]=pairedRoot();key=p<4?'victim':'hurt';index=p<4?[0,1,2,3][p]:3}

async function choose(name){const version=++loadVersion,wasPlaying=playing,d=bank[name],chosen=$('material').value==='source'?d.sourceFrames:$('material').value==='initial'?d.initialFrames:d.frames,list=$('material').value==='source'?d.effects?.sourceFrames:d.effects?.fitFrames;$('loading').hidden=false;$('loading').textContent='正在载入 '+name+'…';const idle=bank['待机'],neutralChosen=$('material').value==='source'?idle.sourceFrames:$('material').value==='initial'?idle.initialFrames:idle.frames;const [loaded,effects,neutralLoaded]=await Promise.all([Promise.all(chosen.map(f=>loadImage(f.file))),Promise.all((list||[]).map(f=>loadImage(f.file))),Promise.all(neutralChosen.map(f=>loadImage(f.file)))]);if(version!==loadVersion)return;neutralFrames=neutralChosen;neutralImages=neutralLoaded;frames=chosen;images=loaded;effectImages=effects;selected=name;time=0;durations=name==='Q · 天星'?d.branches[$('qbranch').value].durations:d.durations;phases=d.phases;total=durations.reduce((a,b)=>a+b,0);$('scrub').max=total-1;$('timeline').replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.className='frame';const c=document.createElement('canvas');c.width=400;c.height=190;const airborne=d.sourceFrames[i].rootKind?.includes('pelvis');drawPose(c.getContext('2d'),i,120,airborne?100:175,f.scale*.4);const label=document.createElement('span');label.textContent=(i+1)+' · '+phases[i];b.append(c,label);b.onclick=()=>{playing=false;time=durations.slice(0,i).reduce((a,b)=>a+b,0);sync();render()};$('timeline').append(b)});document.querySelectorAll('.action').forEach(b=>b.setAttribute('aria-pressed',b.dataset.name===name));$('note').textContent=d.status;$('sourceLink').href=chosen[0].source||chosen[0].file;$('loading').hidden=true;playing=wasPlaying;last=0;sync();render()}

$('play').onclick=()=>{playing=!playing;sync()};$('restart').onclick=()=>{time=0;playing=true;sync();render()};$('prev').onclick=()=>{playing=false;time=Math.max(0,time-1);sync();render()};$('next').onclick=()=>{playing=false;time=Math.min(total-1,time+1);sync();render()};$('scrub').oninput=()=>{playing=false;time=+$('scrub').value;sync();render()};

const configIds=['material','speed','background','body','fx','stageMove','opponent','boxes','loop','mirror','qbranch','airphase'];
try{const c=JSON.parse(localStorage.getItem('zhongli-display-config')||'{}');for(const id of configIds){const el=$(id);if(id in c){if(el.type==='checkbox')el.checked=c[id];else el.value=c[id]}}}catch(e){}
