<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>风起地 · 五档拟合对照</title>
<style>body{margin:0;background:#10151b;color:#e7eef3;font:16px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1400px;margin:auto;padding:24px}h1{font-size:26px;margin:0 0 10px}p{color:#bac8d0;line-height:1.6}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button{color:#e7eef3;background:#253645;border:1px solid #5b7c92;border-radius:20px;padding:10px 22px;cursor:pointer}button[aria-pressed=true]{background:#286b88;border-color:#89d1ee}#stats{min-height:48px;line-height:1.6}#view{overflow:auto;max-height:80vh;border-radius:16px;border:1px solid #536976;background:#000}#picture{display:block;width:100%;image-rendering:pixelated;max-width:none}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{text-align:left;padding:10px;border-bottom:1px solid #344855}small{color:#b2c3cb}.zoom{display:flex;align-items:center;gap:14px;margin:12px 0}.zoom input{width:160px}a{color:#98d5f1}</style>
<main><h1>风起地 · 五档拟合对照</h1><p>同一张场景母版、同样的画面尺寸。绫华采用已确认的新形象；每档画面都由拟合矩形重建，含降色损失。正式 GIA 暂未切换到中高档。</p>
<nav id="levels" aria-label="拟合档位"></nav><div id="stats" aria-live="polite">正在读取拟合报告…</div><div class="zoom"><label>细节放大 <input id="zoom" type="range" min="100" max="400" step="50" value="100"></label><output id="zoomText">100%</output><a id="download">保存本档画面</a></div>
<div id="view"><img id="picture" alt="风起地场景与新版绫华的拟合效果"></div>
<table><thead><tr><th>档位</th><th>场景网格 / 色数</th><th>场景矩形</th><th>绫华矩形</th><th>合计图片 / 约控件</th></tr></thead><tbody id="budget"></tbody></table>
<small>“约控件”按当前通用模板的一容器加一图片估算，只包含本张场景和一张角色帧，不包含第二名角色、菜单、血条等。这里只比较外观和图元数据，本地图片预览耗时不能当成千星真机性能。</small></main>
<script>
fetch('quality-report.json').then(r=>r.json()).then(report=>{window.fitQualityReport=report;let selected='medium';const picture=document.querySelector('#picture'),buttons=document.querySelector('#levels');
function show(p){selected=p.key;const s=p.scenes.find(x=>x.country==='mondstadt');picture.src='mondstadt-'+p.key+'-composite.png';document.querySelector('#download').href=picture.src;document.querySelector('#download').download='风起地-'+p.name+'.png';document.querySelector('#stats').textContent=p.name+' · 场景 '+s.grid.join('×')+' / '+s.colors+' 色 / '+s.rectangles.toLocaleString()+' 个矩形；绫华 '+p.character.grid.join('×')+' / '+p.character.rectangles.toLocaleString()+' 个矩形。角色显示高度始终为226。';for(const b of buttons.children)b.setAttribute('aria-pressed',b.dataset.key===selected);}
for(const p of report.presets){const s=p.scenes.find(x=>x.country==='mondstadt'),b=document.createElement('button');b.type='button';b.textContent=p.name;b.dataset.key=p.key;b.onclick=()=>show(p);buttons.append(b);const tr=document.createElement('tr');for(const v of[p.name,s.grid.join('×')+' / '+s.colors,s.rectangles.toLocaleString(),p.character.rectangles.toLocaleString(),s.totalSceneAndActorImages.toLocaleString()+' / '+s.templateControlsApprox.toLocaleString()]){const td=document.createElement('td');td.textContent=v;tr.append(td);}document.querySelector('#budget').append(tr);}
show(report.presets.find(p=>p.key==='medium'));document.querySelector('#zoom').oninput=e=>{picture.style.width=e.target.value+'%';document.querySelector('#zoomText').textContent=e.target.value+'%';};
}).catch(e=>document.querySelector('#stats').textContent='预览报告尚未生成完：'+e.message);
</script></html>
